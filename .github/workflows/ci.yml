name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-hq-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run db:migrate:local
        env:
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
      - run: npm run build
        env:
          CI: "1"
          WRANGLER_SEND_METRICS: "false"
